name: Build Flutter & Web App

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'Telegram Chat ID'
        required: true
        type: string
      build_type:
        description: 'Build Type (web, flutter-debug, flutter-release)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        if: github.event.inputs.build_type == 'web'
        run: flutter build web --release

      - name: Build Flutter Release APK
        if: github.event.inputs.build_type == 'flutter-release'
        run: flutter build apk --release

      - name: Upload Artifact to Telegram (On Success)
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ github.event.inputs.chat_id }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          document: |
            build/app/outputs/flutter-apk/app-release.apk
            build/web/**/*
          caption: "✅ Build Aldo Berhasil Sempurna! File aplikasi Anda terlampir."

      - name: Send Error Log to Telegram (On Failure)
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ github.event.inputs.chat_id }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ [BUILD FAILED] Terjadi kesalahan fatal saat mengompilasi proyek di GitHub Actions Aldo!
            Silakan periksa konfigurasi pubspec.yaml atau dependensi Anda.
